# Compose file for Podman. Detected automatically by `podman-compose`;
# for Docker Compose pass it explicitly: `docker compose -f podman-compose.yml up`.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SCHEMA_ROOT=/app/schemas
    volumes:
      # :Z relabels the bind mount for SELinux-enforcing rootless Podman
      - ./ndc_schemas:/app/schemas:Z

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    ports:
      - "4321:80"
    depends_on:
      - backend
