name: Deploy Backend to Unikraft Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ndc_schemas/**'
      - 'ndc_content/**'
      - 'iata_ndc_messages.json'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Sync Schemas
        run: |
          mkdir -p src/main/resources/schemas
          cp -r ../ndc_schemas/. src/main/resources/schemas/

      - name: Sync Content
        run: |
          mkdir -p src/main/resources/content
          cp -r ../ndc_content/. src/main/resources/content/

      - name: Run Tests
        run: ./gradlew test

      - name: Build Shadow Jar
        run: ./gradlew shadowJar

      - name: Install Unikraft CLI
        uses: unikraft/setup-action@v1

      - name: Deploy to Unikraft Cloud
        env:
          UNIKRAFT_PROFILE_ENV: "true"
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UKC_METRO: ${{ secrets.UKC_METRO }}
          DEPLOYMENT_NAME: ${{ secrets.UKC_DEPLOYMENT_NAME }}
        run: |
          IMAGE=kgaluszka/ndc-clearance-backend:latest
          unikraft build . --arch x86_64 --output "$IMAGE"
          if unikraft instances get "$DEPLOYMENT_NAME" > /dev/null 2>&1; then
            echo "Instance exists. Removing..."
            unikraft instances delete "$DEPLOYMENT_NAME"
            sleep 5
          fi
          unikraft run --metro "$UKC_METRO" -n "$DEPLOYMENT_NAME" -p 443:8080/http+tls -m 4GiB --domain mcp-ndc.sunrisehikers.io --restart on-failure -e POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} --image "$IMAGE"
